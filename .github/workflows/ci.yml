name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn==1.7.2

      - name: Syntax check across Python modules
        run: python -m compileall -q src Passages main.py

      - name: Verify Etapa 2 representations and Agglomerative pipeline
        run: |
          python Passages/representation.py
          python Passages/agglomerative.py
          python Passages/results.py
